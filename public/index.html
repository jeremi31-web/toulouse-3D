<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Toulouse 3D Interactive - Textures HD</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #ui {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 15, 20, 0.85); padding: 15px 40px; border-radius: 50px;
            color: #fff; display: flex; align-items: center; gap: 25px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: all 0.5s ease;
        }
        input[type=range] { width: 350px; cursor: pointer; accent-color: #00d2ff; }
        #timeLabel { font-weight: 600; font-size: 20px; min-width: 65px; text-align: center; font-variant-numeric: tabular-nums; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 20px; text-align: center; line-height: 1.5; background: rgba(0,0,0,0.8); padding: 30px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #00d2ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="loading"><div class="spinner"></div>Peinture des façades et des toitures...</div>
    <div id="ui" style="display:none;">
        <span style="opacity: 0.7; font-size: 14px; text-transform: uppercase;">Heure locale</span>
        <input type="range" id="timeSlider" min="0" max="24" step="0.05" value="14">
        <span id="timeLabel">14:00</span>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let sunLight, ambientLight;
        let roofMaterial;
        const wallMaterials = []; // On stocke les variantes pour la nuit
        let trafficParticles;
        const trafficData = [];
        const TRAFFIC_COUNT = 1500;

        const CENTER_LAT = 43.6042;
        const CENTER_LON = 1.4435;
        const SCALE = 85000;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0xe0e0e0, 0.0008);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 15000);
            camera.position.set(0, 400, 600);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.02;
            controls.minDistance = 50;
            controls.maxDistance = 3000;

            ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
            sunLight.castShadow = true;
            sunLight.shadow.camera.left = -1500;
            sunLight.shadow.camera.right = 1500;
            sunLight.shadow.camera.top = 1500;
            sunLight.shadow.camera.bottom = -1500;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 5000;
            sunLight.shadow.mapSize.width = 4096;
            sunLight.shadow.mapSize.height = 4096;
            sunLight.shadow.bias = -0.0005;
            scene.add(sunLight);

            // Sol généré
            const groundTex = generateNoiseTexture('#1a1a24', '#222230', 2, 20000);
            groundTex.repeat.set(150, 150);
            const groundMat = new THREE.MeshStandardMaterial({ 
                color: 0x111115, roughness: 0.9, map: groundTex 
            });
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(20000, 20000), groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            generateCityMaterials();
            initVegetation();
            initTraffic();

            window.addEventListener('resize', onWindowResize);
            document.getElementById('timeSlider').addEventListener('input', updateTime);

            fetchData();
        }

        // --- GÉNÉRATION DES TEXTURES DES BÂTIMENTS ---
        function generateCityMaterials() {
            // 1. Matériau des toits (Gris/Rouge brique texturé)
            const canvasR = document.createElement('canvas');
            canvasR.width = 256; canvasR.height = 256;
            const ctxR = canvasR.getContext('2d');
            ctxR.fillStyle = '#6e6259'; // Couleur tuile/béton
            ctxR.fillRect(0, 0, 256, 256);
            for(let i=0; i<8000; i++) { // Grain
                ctxR.fillStyle = Math.random() > 0.5 ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.1)';
                ctxR.fillRect(Math.random()*256, Math.random()*256, 2, 2);
            }
            const texRoof = new THREE.CanvasTexture(canvasR);
            texRoof.wrapS = texRoof.wrapT = THREE.RepeatWrapping;
            texRoof.repeat.set(0.02, 0.02);
            roofMaterial = new THREE.MeshStandardMaterial({ map: texRoof, roughness: 0.9 });

            // 2. Matériaux des façades (3 variantes pour casser la répétition)
            for(let v = 0; v < 3; v++) {
                const canvasW = document.createElement('canvas'); // Texture de jour (Murs + Vitres)
                const canvasE = document.createElement('canvas'); // Texture de nuit (Lumières uniquement)
                canvasW.width = 512; canvasW.height = 512;
                canvasE.width = 512; canvasE.height = 512;
                const ctxW = canvasW.getContext('2d');
                const ctxE = canvasE.getContext('2d');
                
                // Mur de base
                const wallColors = ['#d5d0c8', '#e0e0e0', '#c8cfd5'];
                ctxW.fillStyle = wallColors[v];
                ctxW.fillRect(0, 0, 512, 512);
                ctxE.fillStyle = '#000000'; // Noir = pas de lumière
                ctxE.fillRect(0, 0, 512, 512);
                
                // Dessin des fenêtres
                const cols = 8; const rows = 8;
                for(let i=0; i<cols; i++) {
                    for(let j=0; j<rows; j++) {
                        const x = i * (512/cols) + 12;
                        const y = j * (512/rows) + 15;
                        const w = (512/cols) - 24;
                        const h = (512/rows) - 30;
                        
                        // Vitre de jour (Bleu/Gris sombre)
                        ctxW.fillStyle = '#3a4a5a';
                        ctxW.fillRect(x, y, w, h);
                        
                        // Reflet sur la vitre
                        ctxW.fillStyle = 'rgba(255,255,255,0.15)';
                        ctxW.beginPath(); ctxW.moveTo(x, y); ctxW.lineTo(x+w, y+h); ctxW.lineTo(x, y+h); ctxW.fill();
                        
                        // Lumière de nuit (aléatoire)
                        if (Math.random() > 0.6) {
                            ctxE.fillStyle = Math.random() > 0.4 ? '#ffdd88' : '#aaddff'; // Lumière chaude ou froide
                            ctxE.fillRect(x, y, w, h);
                        }
                    }
                }
                
                const texWall = new THREE.CanvasTexture(canvasW);
                const texEmissive = new THREE.CanvasTexture(canvasE);
                texWall.wrapS = texWall.wrapT = texEmissive.wrapS = texEmissive.wrapT = THREE.RepeatWrapping;
                
                // Échelle de répétition pour que les fenêtres aient une taille réaliste
                texWall.repeat.set(0.04, 0.25);
                texEmissive.repeat.set(0.04, 0.25);

                wallMaterials.push(new THREE.MeshStandardMaterial({
                    map: texWall,
                    roughness: 0.6,
                    emissiveMap: texEmissive,
                    emissive: new THREE.Color(0xffffff),
                    emissiveIntensity: 0 // Éteint le jour
                }));
            }
        }

        function generateNoiseTexture(baseColor, noiseColor, dotSize, iterations) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseColor; ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = noiseColor;
            for (let i = 0; i < iterations; i++) ctx.fillRect(Math.random() * 256, Math.random() * 256, dotSize, dotSize);
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function initVegetation() {
            const treeCount = 2000;
            const geom = new THREE.ConeGeometry(3, 12, 5); 
            geom.translate(0, 6, 0); 
            const mat = new THREE.MeshStandardMaterial({ roughness: 1.0 });
            const trees = new THREE.InstancedMesh(geom, mat, treeCount);
            
            const dummy = new THREE.Object3D();
            const color = new THREE.Color();
            
            for (let i = 0; i < treeCount; i++) {
                dummy.position.set((Math.random() - 0.5) * 3500, 0, (Math.random() - 0.5) * 3500);
                dummy.rotation.y = Math.random() * Math.PI;
                const scale = 0.5 + Math.random() * 0.8;
                dummy.scale.set(scale, scale, scale);
                dummy.updateMatrix();
                trees.setMatrixAt(i, dummy.matrix);
                
                color.setHSL(0.25 + Math.random() * 0.1, 0.4 + Math.random() * 0.3, 0.2 + Math.random() * 0.2);
                trees.setColorAt(i, color);
            }
            trees.castShadow = true; trees.receiveShadow = true;
            scene.add(trees);
        }

        function initTraffic() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(TRAFFIC_COUNT * 3);
            const colors = new Float32Array(TRAFFIC_COUNT * 3);
            
            for (let i = 0; i < TRAFFIC_COUNT; i++) {
                const isHorizontal = Math.random() > 0.5;
                let x = isHorizontal ? (Math.random() - 0.5) * 4000 : Math.round((Math.random() - 0.5) * 40) * 100;
                let z = isHorizontal ? Math.round((Math.random() - 0.5) * 40) * 100 : (Math.random() - 0.5) * 4000;
                
                positions[i*3] = x; positions[i*3+1] = 1.5; positions[i*3+2] = z;
                
                const speed = (Math.random() * 3 + 1) * (Math.random() > 0.5 ? 1 : -1);
                trafficData.push({ isHorizontal, speed });
                
                const isForward = speed > 0;
                const color = new THREE.Color(isForward ? 0xfff5dd : 0xff1111);
                colors[i*3] = color.r; colors[i*3+1] = color.g; colors[i*3+2] = color.b;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({ 
                size: 6, vertexColors: true, sizeAttenuation: true, 
                transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending 
            });
            trafficParticles = new THREE.Points(geometry, material);
            scene.add(trafficParticles);
        }

        async function fetchData() {
            try {
                const res = await fetch('/api/buildings');
                const data = await res.json();
                buildCity(data);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('ui').style.display = 'flex';
                
                updateTime();
                animate();
            } catch (err) {
                document.getElementById('loading').innerHTML = "Erreur de chargement des données.";
            }
        }

        function buildCity(data) {
            const elements = data.elements || [];

            const processShape = (geometryPoints, tags) => {
                if (!geometryPoints || geometryPoints.length < 3) return;

                const shape = new THREE.Shape();
                geometryPoints.forEach((pt, index) => {
                    const x = (pt.lon - CENTER_LON) * SCALE;
                    const y = (pt.lat - CENTER_LAT) * SCALE;
                    if (index === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
                });

                let height = 12;
                if (tags) {
                    if (tags.height) height = parseFloat(tags.height);
                    else if (tags['building:levels']) height = parseFloat(tags['building:levels']) * 3.5;
                }
                if (!tags || (!tags.height && !tags['building:levels'])) height += Math.random() * 6 - 3;

                // Application des matériaux : Index 0 (Toit/Sol), Index 1 (Façades)
                const geometry = new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false });
                geometry.rotateX(-Math.PI / 2);
                
                const randomWallMat = wallMaterials[Math.floor(Math.random() * wallMaterials.length)];
                
                const mesh = new THREE.Mesh(geometry, [roofMaterial, randomWallMat]);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
            };

            elements.forEach(el => {
                if (el.type === 'way' && el.geometry) processShape(el.geometry, el.tags);
                else if (el.type === 'relation' && el.members) {
                    el.members.forEach(m => { if (m.type === 'way' && m.geometry) processShape(m.geometry, el.tags); });
                }
            });
        }

        function updateTime() {
            const slider = document.getElementById('timeSlider');
            const time = parseFloat(slider.value);
            
            const hours = Math.floor(time);
            const minutes = Math.floor((time - hours) * 60);
            document.getElementById('timeLabel').innerText = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;

            const angle = ((time - 6) / 12) * Math.PI; 
            const radius = 2500;
            
            sunLight.position.x = Math.cos(angle) * radius;
            sunLight.position.y = Math.sin(angle) * radius;
            sunLight.position.z = -Math.cos(angle) * 500;

            const isNight = time < 5.5 || time > 18.5;
            const twilight = (time >= 5 && time < 7) || (time > 17.5 && time <= 19.5);

            if (sunLight.position.y < 0) sunLight.intensity = 0;
            else sunLight.intensity = Math.sin(angle) * 3;

            let skyColor, uiColor;
            if (isNight && !twilight) {
                skyColor = new THREE.Color(0x050508);
                ambientLight.intensity = 0.15;
                ambientLight.color.setHex(0x4444ff);
                uiColor = "rgba(10, 10, 15, 0.85)";
            } else if (twilight) {
                skyColor = new THREE.Color(0xff5533);
                ambientLight.intensity = 0.4;
                ambientLight.color.setHex(0xffaa88);
                sunLight.color.setHex(0xff7744);
                uiColor = "rgba(40, 20, 15, 0.85)";
            } else {
                skyColor = new THREE.Color(0xb5d3e7);
                ambientLight.intensity = 0.7;
                ambientLight.color.setHex(0xffffff);
                sunLight.color.setHex(0xffffff);
                uiColor = "rgba(255, 255, 255, 0.2)";
            }

            scene.fog.color = skyColor;
            scene.fog.density = isNight ? 0.0008 : 0.0003;
            renderer.setClearColor(skyColor);
            
            document.getElementById('ui').style.background = uiColor;
            document.getElementById('ui').style.color = (isNight || twilight) ? "#fff" : "#111";
            
            if(trafficParticles) trafficParticles.material.opacity = isNight ? 1.0 : (twilight ? 0.6 : 0.0);

            // Allumage / Extinction des fenêtres des façades
            wallMaterials.forEach(mat => {
                if (isNight) {
                    mat.emissiveIntensity = 1.0; 
                } else if (twilight) {
                    mat.emissiveIntensity = 0.5;
                } else {
                    mat.emissiveIntensity = 0.0;
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (trafficParticles) {
                const pos = trafficParticles.geometry.attributes.position.array;
                for (let i = 0; i < TRAFFIC_COUNT; i++) {
                    const data = trafficData[i];
                    if (data.isHorizontal) {
                        pos[i*3] += data.speed;
                        if (pos[i*3] > 2000) pos[i*3] = -2000;
                        if (pos[i*3] < -2000) pos[i*3] = 2000;
                    } else {
                        pos[i*3+2] += data.speed;
                        if (pos[i*3+2] > 2000) pos[i*3+2] = -2000;
                        if (pos[i*3+2] < -2000) pos[i*3+2] = 2000;
                    }
                }
                trafficParticles.geometry.attributes.position.needsUpdate = true;
            }

            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
